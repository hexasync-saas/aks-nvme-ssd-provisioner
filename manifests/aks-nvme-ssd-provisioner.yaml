apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvme-provisioner-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler-binding
subjects:
- kind: ServiceAccount
  name: nvme-provisioner-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: node-labeler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: kube-system
  name: aks-nvme-ssd-provisioner
  labels:
    app: aks-nvme-ssd-provisioner
spec:
  selector:
    matchLabels:
      name: aks-nvme-ssd-provisioner
  # Replace pods one node at a time by hand (kubectl delete pod), checking Longhorn
  # between nodes; an update never restarts every node's provisioner at once.
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        name: aks-nvme-ssd-provisioner
    spec:
      # The mount is made in the host mount namespace (nsenter -t 1), so it does not
      # depend on this pod's lifetime.
      hostPID: true
      serviceAccountName: nvme-provisioner-sa
      automountServiceAccountToken: true # Must be true to label nodes
      nodeSelector:
        agentpool: nvme
      priorityClassName: system-node-critical
      containers:
        - name: aks-nvme-ssd-provisioner
          image: hexasyncregistry.azurecr.io/hexasync/aks-nvme-ssd-provisioner:202611171200 # not built yet
          imagePullPolicy: Always
          securityContext:
            privileged: true # Required for mounting host drives
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          # Ready only while /hx-disks on the host is mounted from the local NVMe array.
          readinessProbe:
            exec:
              command: ["aks-nvme-ssd-provisioner.sh", "--check"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
