apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvme-provisioner-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler-binding
subjects:
- kind: ServiceAccount
  name: nvme-provisioner-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: node-labeler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: kube-system
  name: aks-nvme-ssd-provisioner
  labels:
    app: aks-nvme-ssd-provisioner
spec:
  selector:
    matchLabels:
      name: aks-nvme-ssd-provisioner
  template:
    metadata:
      labels:
        name: aks-nvme-ssd-provisioner
    spec:
      serviceAccountName: nvme-provisioner-sa
      automountServiceAccountToken: true # Must be true to label nodes
      nodeSelector:
        agentpool: nvme
      priorityClassName: system-node-critical
      containers:
        - name: aks-nvme-ssd-provisioner
          image: hexasyncregistry.azurecr.io/hexasync/aks-nvme-ssd-provisioner:202602281522
          imagePullPolicy: Always
          securityContext:
            privileged: true # Required for mounting host drives
          env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          volumeMounts:
            - mountPath: /hx-disks
              name: hx-disks
              mountPropagation: "Bidirectional"
      volumes:
        - name: hx-disks
          hostPath:
            path: /hx-disks
